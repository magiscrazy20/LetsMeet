{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}LiveKit Meet (Django){% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}?v=2" />
    <link rel="stylesheet" href="{% static 'css/globals.css' %}" />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <div class="header-left">
        <button
          type="button"
          class="nav-toggle"
          id="nav-toggle"
          aria-label="Open navigation menu"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="nav-menu"
        >
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
        <a href="{% url 'home' %}" class="brand-logo" aria-label="LetsMeet home">Lets<span class="brand-accent">Meet</span></a>
      </div>
      <nav class="nav-menu" id="nav-menu" role="menu" hidden aria-label="Sections">
        <a class="nav-item" role="menuitem" href="{% url 'video' %}">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="14" height="12" rx="2"></rect>
              <path d="M22 8l-6 4 6 4z"></path>
            </svg>
          </span>
          <span class="nav-label">Video</span>
        </a>
        <a class="nav-item" role="menuitem" href="{% url 'voice' %}">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="3" width="6" height="12" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="8" y1="22" x2="16" y2="22"></line>
            </svg>
          </span>
          <span class="nav-label">Voice</span>
        </a>
        <a class="nav-item" role="menuitem" href="{% url 'chat' %}">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </span>
          <span class="nav-label">Chat</span>
        </a>
      </nav>
    </header>
    {% block body %}{% endblock %}
    <script src="{% static 'js/nav.js' %}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
