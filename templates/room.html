{% extends "base.html" %}
{% load static %}

{% block title %}Room · {{ room_name }}{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'css/room.css' %}" />
{% endblock %}

{% block body %}
  <main class="room-main" data-lk-theme="default">
    <div id="prejoin" class="prejoin">
      <h2>Joining room <code>{{ room_name }}</code></h2>
      <label for="participant-name">Your name</label>
      <input id="participant-name" type="text" placeholder="Your name" autocomplete="name" />
      <button class="lk-button" id="join-button">Join</button>
      <p id="prejoin-error" class="error"></p>
    </div>

    <section id="room" class="room" hidden>
      <div class="grid" id="participant-grid"></div>
      <div class="toolbar">
        <button class="lk-button" id="toggle-mic" data-state="on">🎤 Mute</button>
        <button class="lk-button" id="toggle-cam" data-state="on">📷 Camera off</button>
        <button class="lk-button" id="switch-cam" hidden aria-label="Switch camera" title="Switch camera">🔄 Flip</button>
        {% if RECORD_ENDPOINT %}
          <button class="lk-button" id="toggle-record" data-state="off">⏺ Record</button>
        {% endif %}
        <button class="lk-button danger" id="leave-button">Leave</button>
      </div>
      <div class="status" id="status"></div>
    </section>
  </main>
{% endblock %}

{% block scripts %}
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script>
    window.ROOM_NAME = "{{ room_name|escapejs }}";
    window.CONNECTION_DETAILS_ENDPOINT = "{{ connection_details_endpoint|escapejs }}";
    window.RECORD_ENDPOINT = "{{ RECORD_ENDPOINT|default:''|escapejs }}";
  </script>
  <script src="{% static 'js/room.js' %}"></script>
{% endblock %}
