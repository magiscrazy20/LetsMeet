{% extends "base.html" %}
{% load static %}

{% block title %}Chat · {{ room_name }}{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'css/chat_room.css' %}" />
{% endblock %}

{% block body %}
  <main class="chat-main" data-lk-theme="default">
    <div id="prejoin" class="chat-prejoin">
      <div class="prejoin-card">
        <div class="prejoin-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <h2>Join chat room</h2>
        <p class="prejoin-room">Room <code>{{ room_name }}</code></p>
        <label for="participant-name" class="visually-hidden">Your name</label>
        <input id="participant-name" type="text" placeholder="Your name" autocomplete="name" />
        <button class="lk-button primary" id="join-button">
          <span aria-hidden="true">💬</span>
          <span>Join chat</span>
        </button>
        <p id="prejoin-error" class="error"></p>
      </div>
    </div>

    <section id="room" class="chat-room" hidden>
      <header class="chat-header">
        <div class="chat-room-name">
          <span class="dot live" aria-hidden="true"></span>
          <span>Chat · <code>{{ room_name }}</code></span>
        </div>
        <div class="chat-header-right">
          <div class="chat-people">
            <span id="people-count">1</span>
            <span class="chat-people-label">online</span>
          </div>
          <button class="header-exit" id="leave-button" type="button" aria-label="Leave chat" title="Leave">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </header>

      <div class="chat-stream" id="chat-stream" aria-live="polite"></div>

      <form class="chat-composer" id="chat-composer" autocomplete="off">
        <input
          id="chat-input"
          type="text"
          placeholder="Type a message…"
          autocomplete="off"
          maxlength="2000"
          aria-label="Message"
        />
        <button class="circle-btn send" id="chat-send" type="submit" aria-label="Send" title="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>

      <div class="chat-status" id="status"></div>
    </section>
  </main>
{% endblock %}

{% block scripts %}
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script>
    window.ROOM_NAME = "{{ room_name|escapejs }}";
    window.CONNECTION_DETAILS_ENDPOINT = "{{ connection_details_endpoint|escapejs }}";
  </script>
  <script src="{% static 'js/chat_room.js' %}"></script>
{% endblock %}
