services:
  - type: web
    name: letsmeet
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn meet.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
